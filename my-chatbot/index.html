<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot by CodTech IT Solutions</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">CodTechAI</span>
        </div>
        <p class="logo-sub">Made by CodTech IT Solutions . 2026</p>
      </div>

      <button class="new-chat-btn" onclick="newChat()">
        <span>+</span> New Chat
      </button>

      <div class="history-label">Recent Chats</div>
      <div class="chat-history" id="chatHistory"></div>

      <div class="sidebar-footer">
        <div class="model-badge">Model: Claude Sonnet</div>
        <p class="footer-note">Built with Anthropic API</p>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area">

      <div class="chat-header">
        <div class="header-left">
          <span class="status-dot"></span>
          <span class="status-text">Connected</span>
        </div>
        <div class="header-title">AI Assistant</div>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
      </div>

      <div class="messages" id="messages">
        <!-- Welcome Screen -->
        <div class="welcome" id="welcome">
          <div class="welcome-icon">◈</div>
          <h1>Hello, I'm CodTechAI</h1>
          <p>Your intelligent assistant, ready to help with anything.</p>
          <div class="suggestions">
            <button class="suggest-btn" onclick="sendSuggestion('Explain quantum computing simply')">Explain quantum computing</button>
            <button class="suggest-btn" onclick="sendSuggestion('Write a Python function to sort a list')">Write Python code</button>
            <button class="suggest-btn" onclick="sendSuggestion('What are the best study habits for students?')">Study tips for students</button>
            <button class="suggest-btn" onclick="sendSuggestion('Summarize the history of artificial intelligence')">History of AI</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="Ask me anything..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="input-note">Press Enter to send · Shift+Enter for new line</p>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
